name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # bh-sd-jwt depends on openssl-sys.
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  matrix:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Re-run the matrix and require the committed result
        run: |
          cargo run --release --bin sdjwt-diff -- --csv "$RUNNER_TEMP/matrix.csv" \
            --details "$RUNNER_TEMP/details.csv" --json "$RUNNER_TEMP/summary.json"
          diff results/matrix.csv "$RUNNER_TEMP/matrix.csv"
          diff results/details.csv "$RUNNER_TEMP/details.csv"
          diff results/summary.json "$RUNNER_TEMP/summary.json"
